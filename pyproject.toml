[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-bench"
version = "0.1.0"
description = "Retro terminal CLI to benchmark local LLMs across providers"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "llm-bench contributors" }]
keywords = ["llm", "benchmark", "ollama", "llama.cpp", "mlx"]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "jinja2>=3.1",
  "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
]
mlx = [
  "mlx-lm>=0.18; sys_platform == 'darwin'",
]
llamacpp = [
  "llama-cpp-python>=0.2.90",
]

[project.scripts]
llm-bench = "llm_bench.cli:app"

[tool.hatch.build.targets.sdist]
include = ["src/llm_bench", "README.md", "examples", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
