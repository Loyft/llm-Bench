# Single-model profile
provider: ollama
models:
  - llama3.2:3b
# Or compare:
# models: [llama3.2:3b, qwen2.5:7b]
# base_url: http://127.0.0.1:11434
context: 8192
tools: true
# all | performance | capability | explicit list, e.g. [speed, reasoning, coding]
tasks: all
# max_items: 5      # quick pass: cap items per capability task
# code_exec: false  # never execute model-written code (skips the coding task)
mode: sequential
# concurrency: 2
runs: 3
warmup: 1
report_dir: ./reports
# workspace: ~/.cache/llm-bench/runs
# keep_workspace: false
# timeout: 120
# seed: 42
# music: true            # play a background track on the live run screen only
# music_path: ~/my-tunes  # a file or a folder; default: the bundled playlist
# music_volume: 0.7     # starting volume 0.0-1.0; p / +/- adjust it during the run
